mode: train_validation_split
max_samples: 40
validation_fraction: 0.2
epochs: 40
batch_size: 8
environment:
  conda_env: BCI
  cuda_visible_devices: 4
  device: cuda
  mixed_precision: true
model:
  d_model: 64
  num_heads: 4
  num_layers: 2
  feedforward_dim: 128
sampling:
  num_samples: 64
  temperature: 1.0
  prior_correction_strength: 1.0
  max_branches: 1000
  max_depth: 64
  max_steps: 200
acceptance:
  minimum_macro_f1_margin: 0.02
  minimum_size_ratio: 0.5
  maximum_size_ratio: 2.0
  require_finite_termination: true
